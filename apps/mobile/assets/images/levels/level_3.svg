<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="l3bg" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#1E1A30"/>
      <stop offset="100%" stop-color="#07070F"/>
    </radialGradient>
    <radialGradient id="l3glow" cx="50%" cy="58%" r="38%">
      <stop offset="0%" stop-color="#F5C518" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#F5C518" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="l3clip">
      <circle cx="100" cy="100" r="98"/>
    </clipPath>
  </defs>

  <!-- Base circle -->
  <circle cx="100" cy="100" r="100" fill="#07070F"/>
  <circle cx="100" cy="100" r="98" fill="url(#l3bg)"/>
  <!-- Warm gold ambient glow -->
  <circle cx="100" cy="100" r="98" fill="url(#l3glow)"/>

  <!-- Stars – many and bright (seasoned nightlifer) -->
  <circle cx="52" cy="40" r="1.5" fill="#F5C518" opacity="0.55"/>
  <circle cx="70" cy="24" r="1.2" fill="#F5C518" opacity="0.48"/>
  <circle cx="148" cy="33" r="2.0" fill="#F5C518" opacity="0.60"/>
  <circle cx="163" cy="55" r="1.5" fill="#F5C518" opacity="0.50"/>
  <circle cx="36" cy="66" r="1.5" fill="#F5C518" opacity="0.42"/>
  <circle cx="165" cy="80" r="1.8" fill="#F5C518" opacity="0.50"/>
  <circle cx="28" cy="118" r="1.2" fill="#F5C518" opacity="0.35"/>
  <circle cx="86" cy="20" r="1.5" fill="#F5C518" opacity="0.45"/>
  <circle cx="132" cy="18" r="1.2" fill="#F5C518" opacity="0.38"/>
  <circle cx="175" cy="108" r="1.2" fill="#F5C518" opacity="0.32"/>
  <circle cx="22" cy="92" r="1.0" fill="#F5C518" opacity="0.28"/>

  <g clip-path="url(#l3clip)">

    <!-- Dark sophisticated jacket -->
    <path d="M68 200 Q70 148 86 137 L114 137 Q130 148 132 200 Z" fill="#1A1A2E"/>
    <!-- Collar -->
    <path d="M86 137 L100 153 L114 137 L107 131 L93 131 Z" fill="#12122A"/>
    <!-- Gold lapel accent -->
    <path d="M93 131 Q100 138 107 131" fill="none" stroke="#F5C518" stroke-width="2.2" opacity="0.70"/>
    <!-- Gold pin/stud on left lapel -->
    <circle cx="95" cy="137" r="2.5" fill="#F5C518" opacity="0.60"/>

    <!-- Neck -->
    <rect x="93" y="120" width="14" height="13" rx="3" fill="#C9905A"/>

    <!-- Head -->
    <ellipse cx="100" cy="107" rx="28" ry="30" fill="#C9905A"/>

    <!-- Hair – styled back, confident -->
    <path d="M73 100 Q73 77 100 75 Q127 77 127 100 Q122 82 100 80 Q78 82 73 100 Z" fill="#2C1A0E"/>
    <!-- Styled side-part line -->
    <path d="M100 75 Q104 79 100 81" fill="none" stroke="#3D2512" stroke-width="1.5"/>

    <!-- Gold-frame sunglasses -->
    <!-- Left lens -->
    <rect x="75" y="99" width="23" height="13" rx="4" fill="#0A0A18"/>
    <rect x="75" y="99" width="23" height="13" rx="4" fill="none" stroke="#F5C518" stroke-width="1.8" opacity="0.88"/>
    <!-- Right lens -->
    <rect x="102" y="99" width="23" height="13" rx="4" fill="#0A0A18"/>
    <rect x="102" y="99" width="23" height="13" rx="4" fill="none" stroke="#F5C518" stroke-width="1.8" opacity="0.88"/>
    <!-- Bridge -->
    <line x1="98" y1="105.5" x2="102" y2="105.5" stroke="#F5C518" stroke-width="1.8" opacity="0.88"/>
    <!-- Temples -->
    <line x1="75" y1="105.5" x2="71" y2="105.5" stroke="#F5C518" stroke-width="1.8" opacity="0.88"/>
    <line x1="125" y1="105.5" x2="129" y2="105.5" stroke="#F5C518" stroke-width="1.8" opacity="0.88"/>
    <!-- Subtle lens sheen -->
    <ellipse cx="82" cy="103" rx="4" ry="2" fill="white" opacity="0.06"/>
    <ellipse cx="109" cy="103" rx="4" ry="2" fill="white" opacity="0.06"/>

    <!-- Slight smirk (one-sided knowing smile) -->
    <path d="M91 119 Q100 126 110 121" fill="none" stroke="#8B4A2A" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Left arm – relaxed at side, cool -->
    <path d="M74 148 L60 162 Q58 165 61 167 L65 168 Q68 169 70 166 L83 152 Z" fill="#1A1A2E"/>
    <ellipse cx="61" cy="167" rx="7.5" ry="7" fill="#C9905A"/>

    <!-- Right arm – extended, holding cocktail glass -->
    <path d="M126 144 L148 130 Q151 128 154 131 L155 135 Q156 138 153 140 L130 152 Z" fill="#1A1A2E"/>
    <ellipse cx="154" cy="132" rx="8" ry="7" fill="#C9905A"/>

    <!-- Martini / cocktail glass -->
    <!-- Glass outline (triangle bowl) -->
    <path d="M143 107 L167 107 L158 131 L152 131 Z"
          fill="none" stroke="#F5C518" stroke-width="2.2" stroke-linejoin="round" opacity="0.92"/>
    <!-- Liquid fill -->
    <path d="M145 109 L165 109 L158 129 L152 129 Z" fill="#F5C518" opacity="0.10"/>
    <!-- Liquid surface line -->
    <line x1="146" y1="112" x2="164" y2="112" stroke="#F5C518" stroke-width="1.2" opacity="0.45"/>
    <!-- Stem -->
    <line x1="155" y1="131" x2="155" y2="144" stroke="#F5C518" stroke-width="2.2" opacity="0.92" stroke-linecap="round"/>
    <!-- Base -->
    <line x1="148" y1="144" x2="162" y2="144" stroke="#F5C518" stroke-width="3" opacity="0.92" stroke-linecap="round"/>
    <!-- Olive garnish on pick -->
    <line x1="148" y1="112" x2="158" y2="112" stroke="#B8924A" stroke-width="1.5"/>
    <circle cx="148" cy="112" r="3.5" fill="#3A6B3A"/>
    <circle cx="158" cy="112" r="3.5" fill="#3A6B3A"/>

    <!-- Sparkles near glass -->
    <circle cx="170" cy="100" r="1.8" fill="#F5C518" opacity="0.65"/>
    <circle cx="174" cy="117" r="1.2" fill="#F5C518" opacity="0.50"/>
    <circle cx="140" cy="96" r="1.4" fill="#F5C518" opacity="0.48"/>
    <!-- Small cross sparkle near glass rim -->
    <line x1="170" y1="100" x2="170" y2="95" stroke="#F5C518" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
    <line x1="167.5" y1="97.5" x2="172.5" y2="97.5" stroke="#F5C518" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>

  </g>

  <!-- Gold ring – bold and full-opacity for level 3 -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="#F5C518" stroke-width="4.5" opacity="1.0"/>
  <!-- Inner glow ring -->
  <circle cx="100" cy="100" r="93" fill="none" stroke="#F5C518" stroke-width="1" opacity="0.22"/>
</svg>
