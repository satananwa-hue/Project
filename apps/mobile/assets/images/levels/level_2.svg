<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="l2bg" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#1A1838"/>
      <stop offset="100%" stop-color="#08080F"/>
    </radialGradient>
    <clipPath id="l2clip">
      <circle cx="100" cy="100" r="98"/>
    </clipPath>
  </defs>

  <!-- Base circle -->
  <circle cx="100" cy="100" r="100" fill="#08080F"/>
  <circle cx="100" cy="100" r="98" fill="url(#l2bg)"/>

  <!-- Stars – medium density (gaining experience) -->
  <circle cx="52" cy="40" r="1.5" fill="#F5C518" opacity="0.42"/>
  <circle cx="70" cy="24" r="1.2" fill="#F5C518" opacity="0.35"/>
  <circle cx="148" cy="33" r="2.0" fill="#F5C518" opacity="0.48"/>
  <circle cx="163" cy="55" r="1.5" fill="#F5C518" opacity="0.38"/>
  <circle cx="36" cy="66" r="1.5" fill="#F5C518" opacity="0.32"/>
  <circle cx="165" cy="82" r="1.8" fill="#F5C518" opacity="0.38"/>
  <circle cx="28" cy="120" r="1.2" fill="#F5C518" opacity="0.25"/>
  <circle cx="88" cy="20" r="1.5" fill="#F5C518" opacity="0.35"/>

  <g clip-path="url(#l2clip)">

    <!-- Blue/indigo jacket body -->
    <path d="M68 200 Q70 148 86 137 L114 137 Q130 148 132 200 Z" fill="#2E3B7A"/>
    <!-- V-collar -->
    <path d="M86 137 L100 153 L114 137 L107 131 L93 131 Z" fill="#1E2858"/>
    <!-- White shirt peek -->
    <path d="M93 131 L100 141 L107 131" fill="#E6EEF5"/>

    <!-- Neck -->
    <rect x="93" y="120" width="14" height="13" rx="3" fill="#C9905A"/>

    <!-- Head -->
    <ellipse cx="100" cy="107" rx="28" ry="30" fill="#C9905A"/>

    <!-- Hair – neat and confident -->
    <path d="M73 100 Q73 77 100 75 Q127 77 127 100 Q121 84 100 83 Q79 84 73 100 Z" fill="#2C1A0E"/>

    <!-- Happy squinting eyes (^_^ arc style) -->
    <path d="M79 106 Q87 98 95 106" fill="none" stroke="#2C1A0E" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M105 106 Q113 98 121 106" fill="none" stroke="#2C1A0E" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Rosy blush circles -->
    <ellipse cx="83" cy="114" rx="9" ry="5.5" fill="#E8896A" opacity="0.35"/>
    <ellipse cx="117" cy="114" rx="9" ry="5.5" fill="#E8896A" opacity="0.35"/>

    <!-- Big smile -->
    <path d="M87 119 Q100 131 113 119" fill="none" stroke="#8B4A2A" stroke-width="3" stroke-linecap="round"/>

    <!-- Left arm – relaxed -->
    <path d="M74 148 L58 163 Q56 166 59 168 L63 169 Q66 170 68 167 L83 152 Z" fill="#2E3B7A"/>
    <ellipse cx="59" cy="168" rx="7.5" ry="7" fill="#C9905A"/>

    <!-- Right arm – raised to hold phone for photo -->
    <path d="M118 143 L143 113 Q146 110 150 113 L152 117 Q154 121 151 123 L124 151 Z" fill="#2E3B7A"/>
    <ellipse cx="151" cy="114" rx="8" ry="7" fill="#C9905A"/>

    <!-- Phone back (taking a photo – we see the camera side) -->
    <rect x="143" y="81" width="22" height="34" rx="3" fill="#1A1A28"/>
    <!-- Camera module -->
    <circle cx="154" cy="92" r="7.5" fill="#111118"/>
    <circle cx="154" cy="92" r="5.5" fill="#0A0A14"/>
    <circle cx="154" cy="92" r="3.5" fill="#181824"/>
    <!-- Lens reflection -->
    <ellipse cx="151" cy="89" rx="2" ry="1.5" fill="white" opacity="0.28"/>
    <!-- Flash LED -->
    <circle cx="162" cy="86" r="2.5" fill="#F5C518" opacity="0.75"/>

    <!-- Star-burst effect near phone (just reviewed!) -->
    <line x1="133" y1="72" x2="133" y2="63" stroke="#F5C518" stroke-width="2.5" stroke-linecap="round" opacity="0.60"/>
    <line x1="129" y1="76" x2="120" y2="76" stroke="#F5C518" stroke-width="2.5" stroke-linecap="round" opacity="0.60"/>
    <line x1="137" y1="76" x2="146" y2="76" stroke="#F5C518" stroke-width="2.5" stroke-linecap="round" opacity="0.60"/>
    <line x1="133" y1="80" x2="133" y2="89" stroke="#F5C518" stroke-width="2.5" stroke-linecap="round" opacity="0.60"/>
    <line x1="126" y1="69" x2="119" y2="62" stroke="#F5C518" stroke-width="1.5" stroke-linecap="round" opacity="0.38"/>
    <line x1="140" y1="69" x2="147" y2="62" stroke="#F5C518" stroke-width="1.5" stroke-linecap="round" opacity="0.38"/>
    <line x1="126" y1="83" x2="119" y2="90" stroke="#F5C518" stroke-width="1.5" stroke-linecap="round" opacity="0.38"/>
    <line x1="140" y1="83" x2="147" y2="90" stroke="#F5C518" stroke-width="1.5" stroke-linecap="round" opacity="0.38"/>

    <!-- Small review-star upper-left -->
    <line x1="30" y1="40" x2="30" y2="32" stroke="#F5C518" stroke-width="2" stroke-linecap="round" opacity="0.50"/>
    <line x1="26" y1="44" x2="18" y2="44" stroke="#F5C518" stroke-width="2" stroke-linecap="round" opacity="0.50"/>
    <line x1="34" y1="44" x2="42" y2="44" stroke="#F5C518" stroke-width="2" stroke-linecap="round" opacity="0.50"/>
    <line x1="30" y1="48" x2="30" y2="56" stroke="#F5C518" stroke-width="2" stroke-linecap="round" opacity="0.50"/>
    <line x1="24" y1="37" x2="18" y2="31" stroke="#F5C518" stroke-width="1.5" stroke-linecap="round" opacity="0.32"/>
    <line x1="36" y1="37" x2="42" y2="31" stroke="#F5C518" stroke-width="1.5" stroke-linecap="round" opacity="0.32"/>
    <line x1="24" y1="51" x2="18" y2="57" stroke="#F5C518" stroke-width="1.5" stroke-linecap="round" opacity="0.32"/>
    <line x1="36" y1="51" x2="42" y2="57" stroke="#F5C518" stroke-width="1.5" stroke-linecap="round" opacity="0.32"/>

