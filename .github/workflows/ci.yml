name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: chiwitrakmaochaaowelarakkhrai
          POSTGRES_PASSWORD: chiwitrakmaochaaowelarakkhrai
          POSTGRES_DB: chiwitrakmaochaaowelarakkhrai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chiwitrakmaochaaowelarakkhrai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://chiwitrakmaochaaowelarakkhrai:chiwitrakmaochaaowelarakkhrai@localhost:5432/chiwitrakmaochaaowelarakkhrai?schema=public
      JWT_SECRET: ci-test-secret
      PHONE_HASH_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm test
        working-directory: apps/api
      - run: npm run test:e2e
        working-directory: apps/api
