services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: nightcheck
      POSTGRES_PASSWORD: nightcheck
      POSTGRES_DB: nightcheck
    ports:
      - "5432:5432"
    volumes:
      - nightcheck_pg_data:/var/lib/postgresql/data

volumes:
  nightcheck_pg_data:
