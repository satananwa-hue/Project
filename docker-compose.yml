services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: chiwitrakmaochaaowelarakkhrai
      POSTGRES_PASSWORD: chiwitrakmaochaaowelarakkhrai
      POSTGRES_DB: chiwitrakmaochaaowelarakkhrai
    ports:
      - "5432:5432"
    volumes:
      - chiwitrakmaochaaowelarakkhrai_pg_data:/var/lib/postgresql/data

volumes:
  chiwitrakmaochaaowelarakkhrai_pg_data:
